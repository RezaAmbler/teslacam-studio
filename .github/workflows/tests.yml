name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Tests use synthetic in-code fixtures and pure logic only — no ffmpeg /
    # VideoToolbox / footage — so they run on Linux even though the tool itself
    # is macOS-specific at render time.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the README's stated minimum; 3.12 is the recommended venv version.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
